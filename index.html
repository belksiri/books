<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livres de Belk Siri — ressources</title>
<meta name="description" content="Ressources gratuites des livres de Belk Siri.">
<link rel="icon" href="data-science-python-pas-a-pas/assets/logo_belksiri.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Jakarta"; src: url("data-science-python-pas-a-pas/assets/PlusJakartaSans-ExtraBold.otf") format("opentype"); font-weight: 800; font-display: swap; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #33415c;
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 48px; }
h1 { font-family: Jakarta, sans-serif; font-weight: 800; color: #14213d; font-size: clamp(30px, 5vw, 42px); letter-spacing: -.02em; margin: 0 0 8px; }
.livres { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px; margin-top: 32px; }
.livre { text-decoration: none; color: inherit; }
.livre img { width: 100%; height: auto; border-radius: 4px; box-shadow: 0 14px 30px -12px rgba(20,33,61,.3); }
.livre strong { display: block; color: #14213d; margin-top: 12px; line-height: 1.3; }
.livre span { font-size: 14px; color: #5c677d; }
/* Vignette typographique, pour un livre dont la couverture n'est pas publiée.
   Mêmes proportions qu'une couverture (2:3) et mêmes ombres que .livre img. */
.tuile { aspect-ratio: 2 / 3; border-radius: 4px; box-shadow: 0 14px 30px -12px rgba(20,33,61,.3);
  background: #23262a; color: #fff; display: flex; flex-direction: column; justify-content: center;
  padding: 10% 9%; border-bottom: 14px solid #fa7b1b; }
.tuile b { font-family: Jakarta, sans-serif; font-weight: 800; font-size: clamp(20px, 3.4vw, 30px);
  line-height: 1.06; letter-spacing: -.02em; display: block; }
.tuile i { font-style: normal; font-weight: 800; font-size: clamp(15px, 2.4vw, 21px);
  color: #fa7b1b; display: block; margin-top: 8px; }
.tuile em { font-style: normal; font-size: 13px; color: #c9cdd4; display: block; margin-top: 14px; }
</style>
</head>
<body>
<main>
  <h1>Livres de Belk Siri</h1>
  <p>Ressources gratuites pour les lecteurs : données, notebooks, exercices et guides.</p>
  <div class="livres">
    <a class="livre" href="data-science-python-pas-a-pas/">
      <img src="data-science-python-pas-a-pas/couverture/couverture_recto_v1.0.1.png" width="1800" height="2700" alt="Couverture de Data science avec Python, pas à pas">
      <strong>Data science avec Python, pas à pas</strong>
      <span>Ressources du lecteur v1.0.1</span>
    </a>
    <a class="livre" href="gnu-radio-pas-a-pas/">
      <div class="tuile" aria-hidden="true">
        <b>GNU&nbsp;Radio</b><i>pas à pas</i>
        <em>Volumes 1 et 2</em>
      </div>
      <strong>GNU Radio pas à pas</strong>
      <span>Ressources du lecteur v1.0.0 — deux volumes</span>
    </a>
  </div>
</main>
</body>
</html>
